# Workspace de la reescritura en Rust (Fase 0.5). Convive con el árbol C
# (`Makefile`, `src/`) hasta que el Rust alcance paridad 1:1 y pase a `main`.
[workspace]
resolver = "2"
members = [
    "crates/wayvpet-common",
    "crates/wayvpet",
    "crates/wayvpetctl",
    "crates/wayvpet-config",
]
# `wayvpet-update` (aviso de nueva versión, spec 0015) queda FUERA del workspace
# a propósito: su cliente HTTPS (`ureq`+`rustls` tras la feature `net`) arrastra
# `ring`, `icu_*`, `webpki-roots`… y Cargo los anota en `Cargo.lock` aunque la
# feature esté apagada. Nix (`cargoLock.lockFile`) vendoriza TODO el lock, así
# que tenerlo aquí engordaría el build del núcleo. El helper tiene su propio
# `Cargo.lock` y lo compila el empaquetado (`make update-helper`, `.deb`/`.rpm`).
exclude = ["crates/wayvpet-update", "crates/wayvpet-vpets"]

[workspace.package]
edition = "2021"
license = "MIT"
# 1.80 lo impone `ksni` (icono de bandeja, spec 0011): D-Bus puro Rust vía
# `zbus`/`async-io`, sin `libdbus` del sistema.
rust-version = "1.80"
repository = "https://github.com/athomo001/wayvpet"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
overflow-checks = true   # los cálculos de parseo/geometría no deben desbordar en silencio
