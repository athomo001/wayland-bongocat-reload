# Tema de Umbreon / Gato Negro HD (theme_format = 3, sprite sheet)
name = Umbreon
author = wayvpet-reload
license = CC0-1.0
theme_format = 3

sheet = sheet.png
sheet_writing = writing.apng
frame_w = 192
frame_h = 160
default_fps = 15
scale_filter = bilinear
input_model = activity
anchor = baseline

# Filas 1-based: fila = estado, columnas = frames (60 fotogramas por ciclo).
# Movimientos calibrados a cadencia fluida y biomecánicamente armónica de gato real.

