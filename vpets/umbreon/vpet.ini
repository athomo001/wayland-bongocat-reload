# Configuración de comportamiento autónomo para Umbreon (Gato Negro)
cat_height = 118
cat_y_offset = 0

# Patrulla / caminata libre por la pantalla (velocidad pausada acorde a 4 fps)
can_roam = 1
roam_speed = 36
roam_margin = 32
flip_on_walk = 1

# Ciclo rico de acciones felinas auténticas en reposo:
# - walk: pasear / trotar con 4 patas
# - run: correr / sprint a toda velocidad
# - happy: saltar y cazar el ratón
# - eat_ram: comer de su plato de comida
# - boring: ponerse lindo (acicalarse la pata y lavarse la cara)
# - angry: arquear el lomo y bufar erizado
# - knead: amasar pan / hacer galletitas con patitas
# - box: meterse en la caja de cartón
# - catch_bug: cazar moscas en el aire
# - roll: rodar por el suelo panza arriba
# - butt_wiggle: meneo de trasero en acecho
# - stretch: estiramiento yoga felino
# (Y al llegar al borde de la pantalla, rasca automáticamente la pared)
idle_actions = walk, knead, run, box, happy, catch_bug, roll, eat_ram, butt_wiggle, boring, stretch, angry
idle_action_interval = 10
idle_action_duration = 6

# Autonomía felina relajada y sensible al tecleo
track_mouse = 0
sleep_timeout = 75
typing_burst = 1
typing_hold_ms = 2200
busy_interrupt = 0
