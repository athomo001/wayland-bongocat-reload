# cargo-deny — control de la cadena de suministro Rust (spec 0013 §7).
#   cargo install cargo-deny && cargo deny check

[advisories]
version = 2
yanked = "deny"
# Avisos de seguridad de RUSTSEC: fallan el build.
ignore = [
    # `paste` sin mantenimiento (no es vulnerabilidad). Entra solo como
    # dependencia transitiva de `image`, que a su vez es **dev-dependency**
    # (ejemplos `gen_*_sheet.rs` que generan las hojas de sprites); no viaja en
    # el binario publicado. Revisar si `image` gana una ruta sin `paste`.
    "RUSTSEC-2024-0436",
    # `ttf-parser` sin mantenimiento (no es vulnerabilidad; el autor recomienda
    # `skrifa`). Entra solo por `egui`/`epaint`/`ab_glyph` en el binario
    # **aparte** `bongocat-config` (spec 0007), no en el núcleo. La migración a
    # `skrifa` es cosa de egui aguas arriba.
    "RUSTSEC-2026-0192",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense", # ksni (icono de bandeja): dominio público, equivalente a CC0
    # ── Solo por el binario aparte `bongocat-config` (egui/eframe, spec 0007) ──
    "BSL-1.0",         # Boost Software License: permisiva tipo MIT (p. ej. `ryu`)
    "NCSA",            # Univ. of Illinois/NCSA: permisiva tipo MIT (`libloading`)
    "OFL-1.1",         # SIL Open Font License: fuentes que egui empaqueta (`default_fonts`)
    "Ubuntu-font-1.0", # licencia de la fuente Ubuntu que egui trae por defecto
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Las dependencias `path` internas del workspace (bongocat-common) no llevan
# versión: son wildcard "legítimos", no de crates.io.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
