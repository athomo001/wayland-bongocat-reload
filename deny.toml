# cargo-deny — control de la cadena de suministro Rust (spec 0013 §7).
#   cargo install cargo-deny && cargo deny check

[advisories]
version = 2
yanked = "deny"
# Avisos de seguridad de RUSTSEC: fallan el build.
ignore = [
    # `paste` sin mantenimiento (no es vulnerabilidad). Entra solo como
    # dependencia transitiva de `image`, que a su vez es **dev-dependency**
    # (ejemplos `gen_*_sheet.rs` que generan las hojas de sprites); no viaja en
    # el binario publicado. Revisar si `image` gana una ruta sin `paste`.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense", # ksni (icono de bandeja): dominio público, equivalente a CC0
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Las dependencias `path` internas del workspace (bongocat-common) no llevan
# versión: son wildcard "legítimos", no de crates.io.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
