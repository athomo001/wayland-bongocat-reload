name: Nix

# El resto de CI (formato, clippy, tests, cargo-deny) está en rust.yml; el
# empaquetado .deb/.rpm y las pruebas de install.sh, en package.yml. Aquí solo
# queda la comprobación del flake de Nix (mantenido por la comunidad, nix/).

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    # El flake lo mantiene la comunidad y no es el camino de release ni el de
    # tests (eso es rust.yml + package.yml). El sandbox de Nix descarga cada
    # crate de crates.io una a una y el runner a veces recibe 403 / falla la
    # verificación TLS; no bloqueamos el CI por eso. Si falla, revisar a mano.
    continue-on-error: true
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          # CA del runner para el sandbox (evita "unable to get local issuer
          # certificate") y reintentos generosos para las descargas de crates.io.
          extra_nix_config: |
            ssl-cert-file = /etc/ssl/certs/ca-certificates.crt
            download-attempts = 5
            connect-timeout = 20
            stalled-download-timeout = 120
      - name: Check flake and package
        run: ./scripts/test_nix_build.sh
