name: Nix

# El resto de CI (formato, clippy, tests, cargo-deny) está en rust.yml; el
# empaquetado .deb/.rpm y las pruebas de install.sh, en package.yml. Aquí solo
# queda la comprobación del flake de Nix (mantenido por la comunidad, nix/).

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
      - name: Check flake and package
        run: ./scripts/test_nix_build.sh
