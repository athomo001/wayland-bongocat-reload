name: Rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/rust.yml"

# `crates/wayvpet-update` está fuera del workspace (lock propio, spec 0015): el
# job `check` cubre el núcleo; `update-helper` lo compila y prueba aparte, con
# y sin la feature `net` (que enlaza `ureq`+`rustls`).

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy
        # Todo lo que se distribuye (lib + los 3 binarios + tests). Los
        # `examples/gen_*_sheet.rs` son generadores de arte de un solo uso: se
        # exige que compilen (paso Tests con --all-targets), no que pasen clippy.
        run: cargo clippy --workspace --lib --bins --tests -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets

  update-helper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/wayvpet-update
    steps:
      - uses: actions/checkout@v4
      - name: Instalar toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/wayvpet-update
      - name: Formato
        run: cargo fmt --all --check
      - name: Clippy (con y sin net)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --features net -- -D warnings
      - name: Tests (con y sin net)
        run: |
          cargo test --locked --all-targets
          cargo test --locked --all-targets --features net
      - name: Build del binario
        run: cargo build --release --locked --features net
      # `wayvpet-update` tiene su propio lock y `deny.toml`; se comprueba aquí,
      # con todas las features (incluye el árbol de `ureq`+`rustls`+`ring`).
      - name: cargo-deny (todas las features)
        run: |
          cargo install --locked cargo-deny
          cargo deny --all-features check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
