name: Publish to AUR

# Al publicar una release, actualiza el paquete `wayvpet` en el AUR a partir de
# packaging/PKGBUILD (solo se sustituyen pkgver y el sha256 del tarball).
#
# Requiere estos secretos en el repo (si no están, el job falla a propósito:
# es la señal de "configura el AUR o borra este workflow"):
#   AUR_USERNAME, AUR_EMAIL, AUR_SSH_PRIVATE_KEY

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  aur-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0

      - name: Rellenar PKGBUILD con la versión y el sha256 de la release
        run: |
          set -eux
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          TARBALL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.event.release.tag_name }}.tar.gz"
          curl -fsSL "$TARBALL" -o src.tar.gz
          SHA256=$(sha256sum src.tar.gz | cut -d' ' -f1)
          sed -i \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/^sha256sums=.*/sha256sums=('${SHA256}')/" \
            packaging/PKGBUILD
          echo "----- PKGBUILD -----"; cat packaging/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@abe8ac26b51011c88be58c8809fd2ac674068ea5 # v4.1.2
        with:
          pkgname: wayvpet
          pkgbuild: ./packaging/PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "wayvpet ${{ github.event.release.tag_name }}"
          force_push: false
