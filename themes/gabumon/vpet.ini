# Configuración y conducta del vPet Gabumon
cat_height = 118
cat_align = center
cat_x_offset = 0
cat_y_offset = 0

# Desplazamiento y patrulla por pantalla
can_roam = 1
roam_speed = 45
roam_margin = 32
flip_on_walk = 1

# Acciones de ocio en reposo (caminar por la pantalla, comer snack/ram)
idle_actions = walk, eat_ram
idle_action_interval = 10
idle_action_duration = 5

# Autonomía y descanso (no interrumpir por teclas aisladas ni seguir ratón con ojos)
track_mouse = 0
typing_burst = 3
typing_hold_ms = 1800
busy_interrupt = 0
sleep_timeout = 35
