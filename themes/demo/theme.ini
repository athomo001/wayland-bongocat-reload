# Tema de demostración de `theme_format = 3` (sprite sheet, spec 0014).
# Arte propio y trivial, generado por `cargo run -p bongocat --example gen_demo_sheet`.
name = Demo Sheet
author = bongocat-reload
license = CC0-1.0
theme_format = 3

sheet = sheet.png
# `writing` sale de un APNG (spec 0014 M3); idle/sleep, de la rejilla.
sheet_writing = writing.apng
frame_w = 48
frame_h = 48
default_fps = 4
input_model = activity
anchor = baseline

# Configuración propia del demo sheet
cat_height = 64
cat_align = center
cat_x_offset = 0
cat_y_offset = 0
can_roam = 0

# Filas 1-based: fila = estado, columnas = frames.
state_idle_row = 1
state_idle_frames = 2

# Para `writing` el nº de frames lo pone el APNG; row/frames aquí se ignoran,
# pero `state_writing_fps` sí manda el ritmo de reproducción.
state_writing_row = 2
state_writing_frames = 3
state_writing_fps = 10

# Sueño con "Zzzz" animados en 4 fotogramas flotantes.
state_sleep_row = 3
state_sleep_frames = 4
state_sleep_fps = 4

# `happy`: se muestra si `happy_kpm` (en el bongocat.conf) se supera al teclear.
state_happy_row = 4
state_happy_frames = 2
state_happy_fps = 6

# `boring`: inactividad prolongada antes del sueño (mitad de `idle_sleep_timeout`).
state_boring_row = 5
state_boring_frames = 2
state_boring_fps = 2

# Seguimiento de ojos con el ratón: 8 direcciones con parpadeo.
state_look_left_row = 6
state_look_left_frames = 2

state_look_right_row = 7
state_look_right_frames = 2

state_look_up_row = 8
state_look_up_frames = 2

state_look_down_row = 9
state_look_down_frames = 2

state_look_up_left_row = 10
state_look_up_left_frames = 2

state_look_up_right_row = 11
state_look_up_right_frames = 2

state_look_down_left_row = 12
state_look_down_left_frames = 2

state_look_down_right_row = 13
state_look_down_right_frames = 2

# Despertar al reanudar actividad.
state_wake_up_row = 14
state_wake_up_frames = 2
state_wake_up_fps = 6
