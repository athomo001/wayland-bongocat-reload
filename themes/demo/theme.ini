# Tema de demostración de `theme_format = 3` (sprite sheet, spec 0014).
# Arte propio y trivial, generado por `cargo run -p bongocat --example gen_demo_sheet`.
name = Demo Sheet
author = bongocat-reload
license = CC0-1.0
theme_format = 3

sheet = sheet.png
# `writing` sale de un APNG (spec 0014 M3); idle/sleep, de la rejilla.
sheet_writing = writing.apng
frame_w = 48
frame_h = 48
default_fps = 4
input_model = activity
anchor = baseline

# Filas 1-based: fila = estado, columnas = frames.
state_idle_row = 1
state_idle_frames = 2

# Para `writing` el nº de frames lo pone el APNG; row/frames aquí se ignoran,
# pero `state_writing_fps` sí manda el ritmo de reproducción.
state_writing_row = 2
state_writing_frames = 3
state_writing_fps = 10

state_sleep_row = 3
state_sleep_frames = 2
