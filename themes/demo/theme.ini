# Tema de demostración de `theme_format = 3` (sprite sheet, spec 0014).
# Arte propio y trivial, generado por `cargo run -p bongocat --example gen_demo_sheet`.
name = Demo Sheet
author = bongocat-reload
license = CC0-1.0
theme_format = 3

sheet = sheet.png
frame_w = 48
frame_h = 48
default_fps = 4
input_model = activity
anchor = baseline

# Filas 1-based: fila = estado, columnas = frames.
state_idle_row = 1
state_idle_frames = 2

state_writing_row = 2
state_writing_frames = 3
state_writing_fps = 10

state_sleep_row = 3
state_sleep_frames = 2
