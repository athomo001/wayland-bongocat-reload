# Tema de Hatsune Miku HD (theme_format = 3, sprite sheet)
name = Hatsune Miku
author = bongocat-reload
license = CC0-1.0
theme_format = 3

sheet = sheet.png
sheet_writing = writing.apng
frame_w = 128
frame_h = 128
default_fps = 10
scale_filter = bilinear
input_model = activity
anchor = baseline

# Filas 1-based: fila = estado, columnas = frames.
state_idle_row = 1
state_idle_frames = 12
state_idle_fps = 10

# Transición suave al empezar a teclear (one-shot sin cortes)
state_start_writing_row = 2
state_start_writing_frames = 6
state_start_writing_fps = 12

# Tocando el sintetizador con notas musicales
state_writing_row = 3
state_writing_frames = 12
state_writing_fps = 12

# Transición suave al terminar de teclear (one-shot sin cortes)
state_end_writing_row = 4
state_end_writing_frames = 6
state_end_writing_fps = 12

# Sueño acostada en almohada con Zzzz animados
state_sleep_row = 5
state_sleep_frames = 12
state_sleep_fps = 6

# Pose feliz agitando el puerro (negi)
state_happy_row = 6
state_happy_frames = 12
state_happy_fps = 10

# Somnolienta acurrucada antes de dormir
state_boring_row = 7
state_boring_frames = 8
state_boring_fps = 5

# Seguimiento de ojos con el ratón en 8 direcciones
state_look_left_row = 8
state_look_left_frames = 4

state_look_right_row = 9
state_look_right_frames = 4

state_look_up_row = 10
state_look_up_frames = 4

state_look_down_row = 11
state_look_down_frames = 4

state_look_up_left_row = 12
state_look_up_left_frames = 4

state_look_up_right_row = 13
state_look_up_right_frames = 4

state_look_down_left_row = 14
state_look_down_left_frames = 4

state_look_down_right_row = 15
state_look_down_right_frames = 4

# Despertar alegre
state_wake_up_row = 16
state_wake_up_frames = 8
state_wake_up_fps = 8

# Caminata fluida articulada en reposo
state_walk_row = 17
state_walk_frames = 12
state_walk_fps = 10

# Comer memoria RAM en reposo ("nom nom")
state_eat_ram_row = 18
state_eat_ram_frames = 12
state_eat_ram_fps = 8
