# Tema de Hatsune Miku HD (theme_format = 3, sprite sheet)
name = Hatsune Miku
author = bongocat-reload
license = CC0-1.0
theme_format = 3

sheet = sheet.png
sheet_writing = writing.apng
frame_w = 128
frame_h = 128
default_fps = 6
scale_filter = bilinear
input_model = activity
anchor = baseline

# Configuración propia del vPet Hatsune Miku
cat_height = 124
cat_align = center
cat_x_offset = 0
cat_y_offset = 6
can_roam = 1
roam_speed = 45

# Filas 1-based: fila = estado, columnas = frames.
state_idle_row = 1
state_idle_frames = 6
state_idle_fps = 5

state_writing_row = 2
state_writing_frames = 6
state_writing_fps = 8

# Sueño acostada en almohada con Zzzz
state_sleep_row = 3
state_sleep_frames = 6
state_sleep_fps = 4

# Pose feliz agitando el puerro (negi)
state_happy_row = 4
state_happy_frames = 6
state_happy_fps = 6

# Somnolienta acurrucada antes de dormir
state_boring_row = 5
state_boring_frames = 4
state_boring_fps = 3

# Seguimiento de ojos con el ratón en 8 direcciones
state_look_left_row = 6
state_look_left_frames = 2

state_look_right_row = 7
state_look_right_frames = 2

state_look_up_row = 8
state_look_up_frames = 2

state_look_down_row = 9
state_look_down_frames = 2

state_look_up_left_row = 10
state_look_up_left_frames = 2

state_look_up_right_row = 11
state_look_up_right_frames = 2

state_look_down_left_row = 12
state_look_down_left_frames = 2

state_look_down_right_row = 13
state_look_down_right_frames = 2

# Despertar alegre
state_wake_up_row = 14
state_wake_up_frames = 4
state_wake_up_fps = 5

# Caminata suave en reposo
state_walk_row = 15
state_walk_frames = 6
state_walk_fps = 6

# Comer memoria RAM en reposo ("nom nom")
state_eat_ram_row = 16
state_eat_ram_frames = 6
state_eat_ram_fps = 5

