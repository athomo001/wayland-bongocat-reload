# Configuración y conducta del vPet Hatsune Miku
cat_height = 124
cat_align = center
cat_x_offset = 0
cat_y_offset = 6

# Desplazamiento y patrulla por pantalla
can_roam = 1
roam_speed = 45
roam_margin = 32
flip_on_walk = 1

# Acciones de ocio en reposo (caminar por la pantalla, comer memoria RAM)
idle_actions = walk, eat_ram
idle_action_interval = 12
idle_action_duration = 5

# Interacción y descanso
track_mouse = 1
sleep_timeout = 30
