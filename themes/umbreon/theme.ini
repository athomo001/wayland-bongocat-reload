state_idle_frames = 16
state_idle_fps = 12

# Transición suave al prepararse para teclear
state_start_writing_row = 2
state_start_writing_frames = 8
state_start_writing_fps = 12

# Tecleo rítmico con patitas alternadas y destellos de anillos amarillos
