# Tema de Umbreon / Gato Negro HD (theme_format = 3, sprite sheet)
name = Umbreon
author = wayvpet-reload
license = CC0-1.0
theme_format = 3

sheet = sheet.png
sheet_writing = writing.apng
frame_w = 128
frame_h = 128
default_fps = 12
scale_filter = bilinear
input_model = activity
anchor = baseline

# Filas 1-based: fila = estado, columnas = frames.
# Reposo: gato sentado erguido, respiración felina, suave vaivén de cola y parpadeo sereno
