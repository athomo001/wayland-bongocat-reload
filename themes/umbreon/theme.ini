state_writing_frames = 16
state_writing_fps = 12

# Transición suave al terminar de teclear
state_end_writing_row = 4
state_end_writing_frames = 8
state_end_writing_fps = 12

# Sueño profundo acurrucado como un gato en almohada con Zzzz ascendentes
