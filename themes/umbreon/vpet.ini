# Configuración de comportamiento autónomo para Umbreon (Gato Negro)
cat_height = 118
cat_y_offset = 0

# Patrulla / caminata libre por la pantalla
can_roam = 1
roam_speed = 52
roam_margin = 32
flip_on_walk = 1

# Ciclo de acciones felinas en reposo:
# - walk: pasear / trotar con 4 patas
# - eat_ram: comer de su plato de comida
# - boring: ponerse lindo (acicalarse la patita y lavarse la cara)
# - happy: saltar y jugar cazando el ratón
# - angry: arquear el lomo y bufar erizado
idle_actions = walk, eat_ram, boring, happy, angry
idle_action_interval = 10
idle_action_duration = 6

# Autonomía felina relajada
track_mouse = 0
sleep_timeout = 25
typing_burst = 3
typing_hold_ms = 1800
busy_interrupt = 0
