[package]
name = "wayvpet"
version = "3.0.0-dev"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Mascota animada sobre Wayland que reacciona al teclado y al ratón."

[lints.rust]
unsafe_code = "deny" # se permitirá solo en los puntos de FFI de Wayland, documentados

[dependencies]
wayvpet-common = { path = "../wayvpet-common" }

# Wayland (cliente). SCTK trae registro, outputs, layer-shell, shm.
wayland-client = "0.31"
smithay-client-toolkit = { version = "0.19", default-features = false }
# foreign-toplevel-management: para auto-ocultar en pantalla completa.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Protocolos wayland-protocols usados:
#   staging  -> ext::foreign_toplevel_list, wp::fractional_scale (HiDPI)
#   unstable -> wp::viewporter (HiDPI: buffer físico -> superficie lógica)
wayland-protocols = { version = "0.32", default-features = false, features = [
    "client",
    "staging",
    "unstable",
] }

# Bucle de eventos: multiplexará Wayland + timer de animación + input + watcher.
calloop = { version = "0.14", features = ["signals"] }
calloop-wayland-source = "0.4"

# Rasterizado SVG. `default-features = false` quita el render de texto/fuentes:
# los SVG del gato son solo trazados (spec 0010). Re-exporta usvg y tiny-skia.
resvg = { version = "0.44", default-features = false }

# Decodificación PNG para temas de sprite sheet (`theme_format = 3`, spec 0014).
# `png` ya está en el árbol vía `tiny-skia`/`resvg`, así que esto no añade
# ninguna dependencia nueva ni peso al binario. La spec mencionaba la crate
# `image`; se pospone a M3 (APNG/GIF), donde sí aportaría algo.
png = "0.17"

# Lectura de /dev/input/event*. El proceso aislado + seccomp (spec 0013) ya
# está: ver `input.rs` (descubrimiento, en el proceso de confianza) e
# `input_child.rs` (lectura real, en el hijo con seccomp).
evdev = "0.12"

# Fichero PID (flock), señales, y SO_PEERCRED del socket IPC — sin `unsafe`.
rustix = { version = "0.38", features = ["fs", "process", "net"] }
libc = "0.2" # solo para constantes de flags de open (O_NOFOLLOW)

# Vigilancia del wayvpet.conf para --watch-config.
inotify = { version = "0.11", default-features = false }

# Icono de bandeja (StatusNotifierItem, spec 0011). `async-io` en vez de `tokio`
# → D-Bus puro Rust vía `zbus`, sin `libdbus` del sistema y sin arrastrar tokio.
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
# `block_on` para el hilo dedicado del servicio del tray.
futures-lite = "2"

# COSMIC no expone wlr-foreign-toplevel: generamos nosotros el cliente del
# protocolo `zcosmic_toplevel_info_v1` a partir del XML (MIT) vendido en
# `protocols/`. El crate `cosmic-protocols` es GPL-3.0 y contaminaría la
# licencia MIT del proyecto, así que solo tomamos el XML.
wayland-scanner = "0.31"
seccompiler = "0.5.0"

[dev-dependencies]
image = "0.25"

# ---------------------------------------------------------------------------
# Empaquetado nativo (spec 0002 M5). Se construye con `make deb` / `make rpm`
# (necesitan `cargo install cargo-deb cargo-generate-rpm`). El árbol de ficheros
# es el mismo que instala el Makefile; el marcador `install-channel` distingue
# el canal para el aviso de nueva versión (spec 0015).
# ---------------------------------------------------------------------------

[package.metadata.deb]
name = "wayvpet"
maintainer = "Athan Espinoza <espinozathan@gmail.com>"
copyright = "2026, Athan Espinoza y colaboradores de wayvpet"
license-file = ["../../LICENSE", "0"]
section = "x11"
priority = "optional"
depends = "$auto"
# Extras opcionales (no dependencias duras): el pack de vpets pesados y el
# helper del aviso de nueva versión. Un `apt install wayvpet` los sugiere;
# `dpkg -i` los ignora sin quejarse.
recommends = "wayvpet-vpets, wayvpet-update"
extended-description = """\
wayvpet dibuja una mascota animada sobre el escritorio en compositores Wayland.
Reacciona al teclado y al raton, admite varios monitores, temas cargados de
disco e icono en la bandeja del sistema. Por privacidad no registra que teclas
se pulsan: el lector de entrada corre aislado con seccomp."""
maintainer-scripts = "../../packaging/deb/"
# `themes/**/*` = solo los temas ligeros integrados (demo, classic, pink). Los
# vpets pesados (miku, umbreon, gabumon…) viven en `vpets/` y los empaqueta
# `wayvpet-vpets`. Añadir un vpet nuevo a `vpets/` no toca este fichero.
assets = [
    ["target/release/wayvpet",        "usr/bin/",                                       "755"],
    ["target/release/wayvpetctl",     "usr/bin/",                                       "755"],
    ["target/release/wayvpet-config", "usr/bin/",                                       "755"],
    ["../../scripts/find_input_devices.sh", "usr/bin/wayvpet-find-devices",             "755"],
    ["../../wayvpet.conf.example",     "usr/share/wayvpet/wayvpet.conf.example",         "644"],
    ["../../man/wayvpet.1",            "usr/share/man/man1/wayvpet.1",                   "644"],
    ["../../presets/*.conf",           "usr/share/wayvpet/presets/",                     "644"],
    ["../../themes/**/*",              "usr/share/wayvpet/themes/",                      "644"],
    ["../../packaging/wayvpet.desktop",        "usr/share/applications/",                "644"],
    ["../../packaging/wayvpet-config.desktop", "usr/share/applications/",                "644"],
    ["../../assets/tray/wayvpet-icon.png", "usr/share/icons/hicolor/64x64/apps/wayvpet.png", "644"],
    ["../../packaging/systemd/wayvpet.service", "usr/lib/systemd/user/wayvpet.service",  "644"],
    ["../../packaging/channel/deb",    "usr/share/wayvpet/install-channel",              "644"],
]

[package.metadata.generate-rpm]
name = "wayvpet"
summary = "Mascota animada sobre Wayland"
license = "MIT"
# `themes/**/*` = solo los ligeros (demo, classic, pink); los pesados van en el
# paquete `wayvpet-vpets` desde `vpets/`.
assets = [
    { source = "target/release/wayvpet",        dest = "/usr/bin/wayvpet",        mode = "755" },
    { source = "target/release/wayvpetctl",     dest = "/usr/bin/wayvpetctl",     mode = "755" },
    { source = "target/release/wayvpet-config", dest = "/usr/bin/wayvpet-config", mode = "755" },
    { source = "scripts/find_input_devices.sh", dest = "/usr/bin/wayvpet-find-devices", mode = "755" },
    { source = "wayvpet.conf.example", dest = "/usr/share/wayvpet/wayvpet.conf.example", mode = "644" },
    { source = "man/wayvpet.1", dest = "/usr/share/man/man1/wayvpet.1", mode = "644", doc = true },
    { source = "presets/*.conf", dest = "/usr/share/wayvpet/presets/", mode = "644" },
    { source = "themes/**/*", dest = "/usr/share/wayvpet/themes/", mode = "644" },
    { source = "packaging/wayvpet.desktop", dest = "/usr/share/applications/wayvpet.desktop", mode = "644" },
    { source = "packaging/wayvpet-config.desktop", dest = "/usr/share/applications/wayvpet-config.desktop", mode = "644" },
    { source = "assets/tray/wayvpet-icon.png", dest = "/usr/share/icons/hicolor/64x64/apps/wayvpet.png", mode = "644" },
    { source = "packaging/systemd/wayvpet.service", dest = "/usr/lib/systemd/user/wayvpet.service", mode = "644" },
    { source = "packaging/channel/rpm", dest = "/usr/share/wayvpet/install-channel", mode = "644" },
]
post_install_script = """
command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || :
command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -qtf /usr/share/icons/hicolor || :
echo "wayvpet: anadete al grupo 'input' (sudo usermod -aG input \\$USER) y reinicia sesion."
echo "wayvpet: autoarranque:  systemctl --user enable --now wayvpet.service"
"""
post_uninstall_script = """
command -v update-desktop-database >/dev/null 2>&1 && update-desktop-database -q /usr/share/applications || :
command -v gtk-update-icon-cache >/dev/null 2>&1 && gtk-update-icon-cache -qtf /usr/share/icons/hicolor || :
"""

[package.metadata.generate-rpm.requires]
# Runtime: solo libc/wayland del sistema; el resto va estático en el binario.

[package.metadata.generate-rpm.recommends]
# Extras opcionales (dependencias débiles): `dnf` los ofrece, no fallan si faltan.
wayvpet-vpets = "*"
wayvpet-update = "*"

