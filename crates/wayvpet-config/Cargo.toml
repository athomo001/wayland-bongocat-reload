# Ventana gráfica de configuración (spec 0007, Fase 4). Binario **aparte**: su
# árbol de dependencias (egui/eframe/winit/glow) no toca el núcleo `wayvpet`.
[package]
name = "wayvpet-config"
version = "3.0.0-dev"
edition.workspace = true
license.workspace = true
rust-version = "1.85"
repository.workspace = true
publish = false
description = "Ventana de configuración visual de wayvpet (egui)"

[dependencies]
wayvpet-common = { path = "../wayvpet-common" }
# `egui` se dibuja a sí misma → misma pinta en GNOME/KDE/COSMIC/wlroots, sin
# librerías de toolkit del sistema. `glow` = backend OpenGL; nativa Wayland con
# respaldo X11.
eframe = { version = "0.32", default-features = false, features = [
    "glow",
    "wayland",
    "x11",
    "default_fonts",
] }
egui = "0.32"
png = "0.17"

[lints.rust]
unsafe_code = "forbid"
