# Aviso pasivo de nueva versión (spec 0015). Crate aparte —y no un módulo de
# `wayvpet-common`— por **peso**: el cliente HTTPS (`ureq`+`rustls`, feature
# `net`, hito M2) se enlaza SOLO en el binario `wayvpet-update-check`, nunca en
# el supervisor ni en `wayvpetctl`. La parte sin feature (este M1) es solo el
# formato del `update-check.json` y la comparación semver.
[package]
name = "wayvpet-update"
version = "3.0.0-dev"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
description = "Aviso pasivo de nueva versión de wayvpet: modelo del estado y comparación semver (spec 0015)."

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Solo `Version` + su `Ord`; sin features extra.
semver = "1"

[features]
default = []
# net = ["dep:ureq"]  # M2: el chequeo HTTPS real, tras esta feature.
